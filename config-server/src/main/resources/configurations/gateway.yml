eureka:
  client:
    register-with-eureka: false

server:
  port: 8222

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: inventory
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/inventory/**

            - id: booking
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/booking/**

            - id: order
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/order/**