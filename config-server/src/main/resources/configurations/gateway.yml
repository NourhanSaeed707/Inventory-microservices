spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091/realms/ticketing-security-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: inventory
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/inventory/**

            - id: booking
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/booking/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingCircuitBreaker
                    fallbackUri: forward:/fallback/booking

            - id: order
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/order/**